name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Apple jobs build with Xcode 27 (Swift 6.4 + the 27 SDKs). They must use Xcode's own toolchain:
# the package compiles its 27-only APIs behind `#if compiler(>=6.4)`, and a separately installed
# Swift 6.2 toolchain cannot read the 27 SDK interfaces. Swift 6.2 compatibility of the
# cross-platform modules is covered by the Linux job, which stays on Swift 6.2.
env:
  XCODE_VERSION: "27.1"

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Print SwiftLint version
        run: swiftlint version

      # Lints Sources, Tests, Examples and Package.swift (strict; missing_docs for public API).
      - name: Lint Swift sources
        run: Scripts/lint-swift.sh

  upstream-drift:
    name: Generator and Fixture Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Verifies the vendored protocol models, provider and channel catalogs, the native-state
      # schema and the upstream-derived test fixtures against the pinned OpenClaw checkout
      # (v2026.9.6, eb377ac59e). The checkout (.codex/openclaw or OPENCLAW_UPSTREAM_DIR) is not
      # part of this repository, so every check is skipped with a warning when it is absent.
      - name: Upstream drift checks
        run: Scripts/check-upstream-drift.sh --allow-missing-upstream

  # Linux job (Swift 6.2): the cross-platform modules must stay Swift 6.2 compatible.
  swift-validation:
    name: Swift Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift 6.2
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.0"
          skip-verify-signature: true

      - name: Print Swift version
        run: swift --version

      - name: Swift build
        run: Scripts/build-linux-runtime.sh

      - name: Networking concurrency gate
        run: Scripts/check-networking-concurrency.sh

      - name: Swift tests
        run: Scripts/test-linux-runtime.sh

  macos-tests:
    name: macOS Build and Tests (Xcode 27)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Print Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Strict build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Networking concurrency gate
        run: Scripts/check-networking-concurrency.sh

      # Live provider and Apple Intelligence suites skip themselves unless their opt-in environment
      # variables (OPENCLAW_LIVE_PROVIDER_TESTS, OPENCLAW_LIVE_APPLE_FM, ...) are set.
      - name: Swift tests
        run: swift test

  apple-platform-matrix:
    name: Apple Platform Matrix (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos
          - ios
          - tvos
          - watchos
          - visionos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Print Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Validate Apple matrix contract
        run: Scripts/validate-apple-matrix.sh --platform "${{ matrix.platform }}"

      - name: Typecheck OpenClawKit at the deployment floor
        run: Scripts/typecheck-apple-sdks.sh "${{ matrix.platform }}"

      # Builds every product (scheme OpenClawKit-Package; DerivedData in .build/xcode-<platform>).
      # macOS builds with `swift build -Xswiftc -warnings-as-errors`.
      - name: Build all products
        run: Scripts/build-apple-platforms.sh "${{ matrix.platform }}"

      # Links the built objects at the deployment floor and fails on strong links to frameworks
      # newer than the floor and on strong references to 27-only Swift runtime symbols.
      - name: Weak-link check
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            Scripts/check-apple-weak-links.sh macos
          else
            Scripts/check-apple-weak-links.sh "${{ matrix.platform }}" --no-build
          fi

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-logs-${{ matrix.platform }}
          path: .build/logs
          if-no-files-found: ignore

  model-delegation-trait:
    name: ExperimentalAppleModelDelegation Trait
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # The trait compiles the underscored AppIntents 27 `_ModelDelegationIntent` surface.
      - name: Strict build with the trait
        run: swift build --traits ExperimentalAppleModelDelegation -Xswiftc -warnings-as-errors

      - name: App Intents tests with the trait
        run: swift test --traits ExperimentalAppleModelDelegation --filter "PackageSkeletonTests|OpenClawAppIntents"

  ios-example-build:
    name: iOS Example Build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Build iOS example
        run: Scripts/build-ios-example.sh

  tvos-example-build:
    name: tvOS Example Build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Build tvOS example
        run: Scripts/build-tvos-example.sh
